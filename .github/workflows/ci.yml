name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked backend
        run: uv sync --frozen --extra dev
      - name: Lint backend
        run: uv run ruff check .
      - name: Check backend formatting
        run: uv run ruff format --check .
      - name: Test backend with coverage
        run: uv run pytest
      - name: Verify empty database migration
        env:
          DATABASE_URL: sqlite+pysqlite:///./migration-check.db
        run: uv run alembic upgrade head
      - name: Verify committed OpenAPI schema
        run: uv run python ../scripts/export_openapi.py; git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format
      - name: Verify generated API types
        run: npm run api:types; git diff --exit-code -- src/lib/generated/api.ts
      - name: Test frontend with coverage
        run: npm run test:coverage
      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  windows-smoke:
    runs-on: windows-latest
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Smoke backend import
        working-directory: backend
        run: uv sync --frozen --extra dev; uv run python -c "from app.main import app; assert app.openapi()['info']['title']"
      - name: Smoke frontend build
        working-directory: frontend
        run: npm ci; npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: vibe-data-universe-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          build-args: VITE_API_BASE_URL=http://127.0.0.1:8000/api/v1
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: vibe-data-universe-frontend:ci
