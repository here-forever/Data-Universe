services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: sqlite+pysqlite:////app/storage/vibe-data.db
      DATA_STORAGE_ROOT: /app/storage/datasets
      EXPORT_STORAGE_ROOT: /app/storage/exports
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-134217728}
      DATASET_MAX_ROWS: ${DATASET_MAX_ROWS:-500000}
      DATASET_MAX_COLUMNS: ${DATASET_MAX_COLUMNS:-300}
      PREVIEW_ROWS: ${PREVIEW_ROWS:-30}
      PARTICLE_SAMPLE_ROWS: ${PARTICLE_SAMPLE_ROWS:-1500}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      LLM_API_STYLE: ${LLM_API_STYLE:-responses}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_storage:
